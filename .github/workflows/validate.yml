name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate plugin manifests
        run: |
          for plugin in plugins/*/; do
            echo "::group::${plugin}"
            claude plugin validate "./${plugin}" --strict
            echo "::endgroup::"
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # find, not a glob: covers every plugin and nested dirs like scripts/lib
      - name: Run ShellCheck
        run: |
          find plugins -name '*.sh' -print0 | xargs -0 -r shellcheck

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python scripts
        run: python3 -m compileall -q plugins

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run offline script tests
        run: |
          shopt -s nullglob
          tests=(plugins/*/skills/*/scripts/test-*.sh plugins/*/scripts/test-*.sh)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No test scripts found" >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "::group::${test}"
            bash "${test}"
            echo "::endgroup::"
          done
